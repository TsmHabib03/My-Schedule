<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#005BAC">
  <meta name="description" content="Notes for QCU Student Portal — jot down lecture notes, reminders, and study guides.">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Notes | QCU Portal</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/jpeg" href="assets/images/QCU college of computer studies logo.jpg">
  <link rel="apple-touch-icon" href="assets/images/QCU college of computer studies logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css?v=14">
</head>
<body data-page="notes">
  <div class="app-shell">
    <header id="app-header" class="page-header"></header>

    <main class="page-container section-stack" style="max-width:720px;">

      <section class="portal-card">
        <h1 class="page-title">Notes</h1>
        <p class="caption" style="margin-top:4px;">Jot down lecture notes, reminders, and study guides.</p>
      </section>

      <!-- Toolbar: Search + Filters -->
      <section class="portal-card" style="display:flex;flex-direction:column;gap:10px;">
        <div class="task-toolbar">
          <div class="task-search-wrap">
            <i data-lucide="search" class="task-search-icon"></i>
            <input id="note-search" class="task-search-input" type="text" placeholder="Search notes…">
            <button type="button" class="task-search-clear" id="note-search-clear" aria-label="Clear search"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
          </div>
          <div class="task-filters">
            <select id="note-filter-subject" class="task-filter-select">
              <option value="all">All Subjects</option>
            </select>
            <select id="note-sort" class="task-filter-select">
              <option value="newest">Newest First</option>
              <option value="oldest">Oldest First</option>
              <option value="alpha">A → Z</option>
            </select>
          </div>
        </div>
      </section>

      <!-- Notes List -->
      <section id="note-list" style="display:flex;flex-direction:column;gap:10px;"></section>

    </main>

    <!-- Add / Edit Note Modal -->
    <div id="note-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-label="Note form">
      <div id="note-modal-content" class="modal-card"></div>
    </div>

    <nav id="bottom-nav" class="bottom-nav" aria-label="Primary navigation"></nav>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="assets/js/app.js?v=14"></script>
</body>
</html>
