<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#005BAC">
  <title>Today | QCU Schedule</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="today">
  <div class="app-shell">
    <header id="app-header" class="page-header"></header>
    <main class="page-container section-stack">
      <section class="portal-card">
        <h1 class="page-title">Today's Schedule</h1>
        <p id="live-date" class="mt-2 text-[color:var(--muted)]">Loading date</p>
      </section>
      <section id="today-cards" class="grid gap-4 md:grid-cols-2"></section>
    </main>
    <nav id="bottom-nav" class="bottom-nav" aria-label="Primary navigation"></nav>
  </div>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="assets/js/app.js"></script>

</html>
